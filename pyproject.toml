[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "charuco-realsense"
version = "0.1.0"
description = "Detect ChArUco boards generated by charuco-generator with an Intel RealSense D435i"
requires-python = ">=3.11"
dependencies = [
    "pyrealsense2",
    "opencv-python==4.11.0.86",
    "numpy==2.3.5",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
charuco-realsense = "charuco_realsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
